# Health monitor for the Render-hosted demo and its Key Value (Redis) store.
#
# NOTE: GitHub runs `schedule:` triggers ONLY from the repository's DEFAULT
# branch (main). This file must live on main to fire at all -- keeping it only
# on the `render` deploy branch is why the previous keepalive never ran once.
#
# The Render Key Value instance is reachable only on Render's internal network,
# so this job cannot talk to it directly. It doesn't need to: hitting /health
# makes the app itself run a Redis command, which is a truer end-to-end check
# than an external PING anyway.
name: Redis Keepalive

on:
  schedule:
    # Every 6 hours: frequent enough to catch a broken store the same day,
    # cheap enough to leave running forever.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Needed by the anti-auto-disable step below, which pushes a timestamp commit.
permissions:
  contents: write

concurrency:
  group: redis-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      # No checkout or npm install needed -- this is just an HTTP probe.
      # Render's free tier sleeps after ~15 min idle and a cold start can take
      # close to a minute, hence the retries and the long timeout.
      - name: Wake Render service and check Redis via /health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://netflix-clone-tysd.onrender.com/health' }}
        run: |
          echo "Probing $HEALTH_URL"
          # --fail makes a 503 (Redis unreachable) fail the job rather than
          # passing on a body that says "error".
          curl --fail --show-error --location \
               --retry 5 --retry-all-errors --retry-delay 20 \
               --max-time 150 \
               "$HEALTH_URL"

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, which would silently kill this monitor. A commit twice a month
      # resets that clock. It lands on the default branch, not the `render`
      # deploy branch, so it triggers no Render redeploy.
      - name: Keep the schedule from being auto-disabled
        if: github.event_name == 'schedule'
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" != "01" ] && [ "$DAY" != "15" ]; then
            echo "Not a refresh day (day $DAY); skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git add .github/last-keepalive
          git commit -m "chore: record keepalive run (keeps scheduled workflow enabled)"
          git push
