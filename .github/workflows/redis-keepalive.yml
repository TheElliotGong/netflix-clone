# Keeps the Redis Cloud database alive and monitors the Render-hosted demo.
#
# NOTE: GitHub runs `schedule:` triggers ONLY from the repository's DEFAULT
# branch (main). This file must live on main to fire at all -- keeping it only
# on the `render` deploy branch is why the previous version of this workflow
# never ran once, and the database it was meant to protect got deleted.
name: Redis Keepalive

on:
  schedule:
    # Every 6 hours: frequent enough to catch a broken store the same day,
    # cheap enough to leave running forever.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Needed by the anti-auto-disable step below, which pushes a timestamp commit.
permissions:
  contents: write

concurrency:
  group: redis-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Waking the web service also exercises Redis through the app itself --
      # the closest thing to real traffic. Render's free tier cold start can
      # take close to a minute, hence the retries and long timeout. Failure
      # here is not fatal: it just means the app/deploy has a problem, which
      # the direct ping below is unaffected by.
      - name: Wake Render service and probe /health
        continue-on-error: true
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://netflix-clone-tysd.onrender.com/health' }}
        run: |
          curl --fail --show-error --location \
               --retry 5 --retry-all-errors --retry-delay 20 \
               --max-time 120 \
               "$HEALTH_URL"

      # Authoritative: talks to Redis Cloud directly, independent of whether
      # the Render app or deploy is healthy. This is what actually prevents
      # the database from being deleted for inactivity.
      - name: Ping Redis Cloud directly
        env:
          REDISCLOUD_URL: ${{ secrets.REDISCLOUD_URL }}
        run: node server/redisKeepAlive.js

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, which would silently kill this job and then the database.
      # A commit twice a month resets that clock. It lands on the default
      # branch, not the `render` deploy branch, so it triggers no redeploy.
      - name: Keep the schedule from being auto-disabled
        if: github.event_name == 'schedule'
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" != "01" ] && [ "$DAY" != "15" ]; then
            echo "Not a refresh day (day $DAY); skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git add .github/last-keepalive
          git commit -m "chore: record keepalive run (keeps scheduled workflow enabled)"
          git push
